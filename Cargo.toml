[workspace]
members = ["crates/flac-core", "crates/flac-node"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
authors = ["Brashkie <dev@brashkie.dev>"]
license = "Apache-2.0"
repository = "https://github.com/Brashkie/kryx-flac"

[workspace.dependencies]
kryx-flac = { path = "crates/flac-core" }
napi = { version = "3.16", features = ["napi8"] }
napi-derive = "2.16"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
